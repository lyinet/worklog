apply plugin: 'com.android.application'

// 版本信息：
// - versionName 必须和仓库根目录 package.json 的 version 一致，下面会校验，不一致直接构建失败。
// - versionCode 只能递增，每次发版发布前手动 +1（Google Play 不接受重复的 versionCode）。
// 发版流程：改 package.json 的 version → 同步这里的 versionName → versionCode +1。
def appVersionName = "1.2.0"
def packageVersion = new groovy.json.JsonSlurper().parseText(file('../../package.json').text).version
if (packageVersion != appVersionName) {
    throw new GradleException(
        "版本不一致：package.json 是 ${packageVersion}，build.gradle 的 versionName 是 ${appVersionName}。" +
        "请把两处改成同一个版本再构建。"
    )
}

// 发布签名：密码只放在 android/keystore.properties（已 gitignore）。
// 文件或 keystore 缺失时不让整个工程配置失败，release 回退到 debug 签名并给出警告，
// 这样本地仍能 assembleRelease 做 minify 验证；正式分发前必须补上真实签名。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def releaseSigningConfigured = false
def releaseSigningError = null
if (keystorePropertiesFile.exists()) {
    try {
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
        def requiredKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        def missingKeys = requiredKeys.findAll { !keystoreProperties[it] }
        def storeFileValue = keystoreProperties['storeFile']
        def resolvedStoreFile = storeFileValue ? rootProject.file(storeFileValue) : null
        if (!missingKeys.isEmpty()) {
            releaseSigningError = "keystore.properties 缺少字段：${missingKeys.join(', ')}"
        } else if (!resolvedStoreFile.exists()) {
            releaseSigningError = "keystore 文件不存在：${resolvedStoreFile}"
        } else {
            releaseSigningConfigured = true
        }
    } catch (Exception e) {
        releaseSigningError = "读取 keystore.properties 失败：${e.message}"
    }
} else {
    releaseSigningError = "未找到 android/keystore.properties"
}

android {
    namespace = "com.lyinet.worklog"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lyinet.worklog"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                logger.warn("WARNING: release 未配置签名（${releaseSigningError}），回退到 debug 签名。此 APK 不可分发。")
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
